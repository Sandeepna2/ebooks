{% extends 'base.html' %}

{% block title %}eBooks | Contact Us{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card p-4 shadow">
        <h2 class="fw-bold mb-3 text-primary"><i class="fas fa-envelope me-2"></i>Contact Our Support Team</h2>
        <p class="text-muted mb-4">Have questions about an order or digital download? Send us a message.</p>

        <form method="post" action="{% url 'store:contact' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="name" class="form-label font-weight-bold">Full Name</label>
            <input type="text" name="name" class="form-control" id="name" required placeholder="John Doe">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" id="email" required placeholder="john@example.com">
          </div>
          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" name="subject" class="form-control" id="subject" required placeholder="Order inquiry, technical help...">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea name="message" class="form-control" id="message" rows="5" required placeholder="Write your message here..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
