{% extends 'base.html' %}

{% block title %}eBooks | Register Account{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow">
        <div class="text-center mb-4">
          <i class="fas fa-user-plus fa-4x text-primary mb-2"></i>
          <h2 class="fw-bold">Create Reader Account</h2>
          <p class="text-muted small">Join thousands of readers and collect your favorite eBooks</p>
        </div>

        <form method="post" action="{% url 'accounts:register' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label font-weight-bold">Username</label>
            <input type="text" name="username" class="form-control" id="id_username" required placeholder="Choose a username">
          </div>

          <div class="mb-3">
            <label for="id_password1" class="form-label font-weight-bold">Password</label>
            <input type="password" name="password1" class="form-control" id="id_password1" required placeholder="Enter password (min 4 characters)">
          </div>

          <div class="mb-3">
            <label for="id_password2" class="form-label font-weight-bold">Confirm Password</label>
            <input type="password" name="password2" class="form-control" id="id_password2" required placeholder="Re-enter password">
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">Create Account</button>

          <p class="text-center text-muted mb-0">
            Already have an account? <a href="{% url 'accounts:login' %}" class="fw-bold text-primary">Login Here</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
