{% extends 'base.html' %}

{% block title %}eBooks | Account Login{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow">
        <div class="text-center mb-4">
          <i class="fas fa-user-circle fa-4x text-primary mb-2"></i>
          <h2 class="fw-bold">Sign In to eBooks</h2>
          <p class="text-muted small">Access your personal digital library</p>
        </div>

        <form method="post" action="{% url 'accounts:login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label font-weight-bold">Username</label>
            <input type="text" name="username" class="form-control" id="id_username" required autofocus placeholder="Enter your username">
          </div>

          <div class="mb-3">
            <label for="id_password" class="form-label font-weight-bold">Password</label>
            <input type="password" name="password" class="form-control" id="id_password" required placeholder="Enter your password">
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">Sign In</button>

          <p class="text-center text-muted mb-0">
            Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-bold text-primary">Register Here</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
